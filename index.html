<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cercador de Repositoris de GitHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        /* Tipografia Helvetica */
        .font-helvetica {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* Estil per a la caixeta de presentació */
        .badge-autor {
            background-color: #e9ecef;
            border-radius: 8px;
            padding: 6px 14px;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-light min-vh-100 py-5">
<div class="container">
    <!-- Formulari de Cerca -->
    <div class="row justify-content-center mb-4">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <!-- Títol en Helvetica -->
                    <h2 class="card-title mb-2 fw-bold font-helvetica">
                        <i class="bi bi-github me-2"></i>Cercador de Repositoris
                    </h2>

                    <!-- El teu nom dins la caixeta estilitzada -->
                    <div class="mb-4">
                        <span class="badge-autor text-secondary font-helvetica small">
                            Desenvolupat per <strong class="text-dark">Guillem Crespí Terrasa</strong> - DSA 2627Q2
                        </span>
                    </div>

                    <form id="searchForm">
                        <div class="input-group mb-2">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" id="usernameInput" class="form-control" placeholder="Nom d'usuari de GitHub (ex: octocat)" required>
                            <button class="btn btn-primary px-4" type="submit" id="searchBtn">
                                <i class="bi bi-search me-1"></i> Cercar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Spinner de Càrrega -->
    <div id="loadingSpinner" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregant...</span>
        </div>
        <p class="text-muted mt-2 font-helvetica">Consultant dades a GitHub...</p>
    </div>

    <!-- Alerta d'Error -->
    <div id="errorMessage" class="alert alert-danger d-none mx-auto text-center font-helvetica" style="max-width: 600px;" role="alert"></div>

    <!-- Informació de l'Usuari -->
    <div id="userInfo" class="row justify-content-center mb-4 d-none">
        <div class="col-md-8">
            <div class="card bg-white shadow-sm border-0 p-3 rounded-3">
                <div class="d-flex align-items-center">
                    <img id="userAvatar" src="" alt="Avatar" class="rounded-circle me-3 border" width="60" height="60">
                    <div>
                        <h5 class="mb-1 font-helvetica fw-bold" id="userName"></h5>
                        <p class="text-muted mb-0 font-helvetica">
                            <i class="bi bi-people-fill text-secondary me-1"></i>
                            <span id="userFollowers" class="fw-semibold">0</span> seguidors
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Taula de Repositoris -->
    <div id="reposContainer" class="card shadow-sm border-0 d-none rounded-3 overflow-hidden">
        <div class="card-header bg-white py-3">
            <h5 class="card-title mb-0 fw-bold font-helvetica">
                <i class="bi bi-folder2-open me-2 text-primary"></i>Repositoris públics
            </h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 font-helvetica">
                <thead class="table-light">
                <tr>
                    <th scope="col" style="width: 30%;">Nom</th>
                    <th scope="col" style="width: 45%;">Descripció</th>
                    <th scope="col" class="text-center" style="width: 25%;">Seguidors de l'usuari</th>
                </tr>
                </thead>
                <tbody id="reposTableBody">
                <!-- Files afegides per jQuery -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- jQuery CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Lògica de l'aplicació -->
<script>
    $(document).ready(function() {$('#searchForm').on('submit', function(e) {
        e.preventDefault();
        const username = $('#usernameInput').val().trim();
        if (!username) return;

        // Reset d'estats visuals
        $('#errorMessage').addClass('d-none').text('');
        $('#reposContainer').addClass('d-none');
        $('#userInfo').addClass('d-none');
        $('#reposTableBody').empty();
        $('#loadingSpinner').removeClass('d-none');
        $('#searchBtn').prop('disabled', true);

        // 1. Obtenir dades de l'usuari (per als seguidors)
        $.ajax({
            url: `https://api.github.com/users/${encodeURIComponent(username)}`,
            method: 'GET',
            dataType: 'json'
        })
            .done(function(userData) {
                const followersCount = userData.followers;
                $('#userAvatar').attr('src', userData.avatar_url);
                $('#userName').text(userData.name || userData.login);
                $('#userFollowers').text(followersCount);
                $('#userInfo').removeClass('d-none');

                // 2. Obtenir els repositoris de l'usuari
                return $.ajax({
                    url: `https://api.github.com/users/${encodeURIComponent(username)}/repos?sort=updated&per_page=100`,
                    method: 'GET',
                    dataType: 'json'
                })
                    .done(function(repos) {
                        if (repos.length === 0) {
                            $('#reposTableBody').html('<tr><td colspan="3" class="text-center py-4 text-muted">Aquest usuari no té repositoris públics.</td></tr>');
                        } else {
                            repos.forEach(function(repo) {
                                const desc = repo.description ? repo.description : '<span class="text-muted fst-italic">Sense descripció</span>';
                                const row = `
                                <tr>
                                    <td>
                                        <a href="${repo.html_url}" target="_blank" class="fw-semibold text-decoration-none">
                                            ${repo.name} <i class="bi bi-box-arrow-up-right small"></i>
                                        </a>
                                    </td>
                                    <td>${desc}</td>
                                    <td class="text-center"><span class="badge bg-secondary-subtle text-secondary-emphasis">${followersCount}</span></td>
                                </tr>
                            `;
                                $('#reposTableBody').append(row);
                            });
                        }
                        $('#reposContainer').removeClass('d-none');
                    });
            })
            .fail(function(jqXHR) {
                if (jqXHR.status === 404) {
                    $('#errorMessage').text("No s'ha trobat cap usuari amb aquest nom a GitHub.").removeClass('d-none');
                } else if (jqXHR.status === 403) {
                    $('#errorMessage').text("S'ha superat el límit de peticions de la API de GitHub. Espera uns minuts.").removeClass('d-none');
                } else {
                    $('#errorMessage').text("S'ha produït un error en connectar amb GitHub.").removeClass('d-none');
                }
            })
            .always(function() {
                $('#loadingSpinner').addClass('d-none');
                $('#searchBtn').prop('disabled', false);
            });
    });
    });
</script>
</body>
</html>
